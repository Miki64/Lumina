<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="luminaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A73E8" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#luminaGrad)" />
  
  <!-- Medical Cross & Sparkle -->
  <g filter="url(#glow)">
    <!-- Vertical bar of medical cross -->
    <rect x="220" y="116" width="72" height="280" rx="36" fill="#FFFFFF" />
    <!-- Horizontal bar of medical cross -->
    <rect x="116" y="220" width="280" height="72" rx="36" fill="#FFFFFF" />
    
    <!-- Central golden medical pulse dot -->
    <circle cx="256" cy="256" r="28" fill="#FBBF24" />
  </g>
  
  <!-- Modern Sparkles -->
  <path d="M380 90 L390 120 L420 130 L390 140 L380 170 L370 140 L340 130 L370 120 Z" fill="#FBBF24" />
</svg>